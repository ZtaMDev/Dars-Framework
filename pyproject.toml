[build-system]
requires = [ "setuptools>=42", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "dars_framework"
version = "1.5.1"
description = "Dars is a Python UI framework for building modern, interactive web apps with only Python code. Write your interface in Python, export it to static HTML/CSS/JS, and deploy anywhere."
dependencies = [ "rich==14.2.0", "bs4==0.0.2", "uvicorn==0.38.0", "markdown2==2.5.4", "requests==2.32.5",]
license = "MPL-2.0"
readme = "README.md"
[[project.authors]]
name = "ztamdev"
email = "ztadevs@gmail.com"

[project.optional-dependencies]
dev = [ "matplotlib==3.8.2", "seaborn==0.13.0", "altair==5.2.0", "mpld3==0.5.10",]

[project.scripts]
dars = "dars.cli.main:main"

[tool.setuptools.packages.find]
include = [ "dars*",]
exclude = [ "LandingPage*",]
