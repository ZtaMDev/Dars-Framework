[build-system]
requires = [ "setuptools>=42", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "dars-framework"
version = "1.9.2"
description = "Dars is a Full-Stack multiplatform Python UI framework for building modern, interactive web and desktop apps with Python code. Seamlessly integrated with FastAPI, it allows you to build complete applications with Server-Side Rendering (SSR) and reactive SPA capabilities also classic multipage html and desktop apps in a single codebase."
dependencies = [ "rich==15.0.0", "bs4==0.0.2", "uvicorn==0.46.0", "markdown2==2.5.5", "requests==2.33.1", "plotly==6.7.0", "fastapi==0.136.1", "rjsmin==1.2.5", "rcssmin==1.2.2",]
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.11"
keywords = [ "ui-framework", "web-framework", "python-ui", "static-site-generator", "html-css-js", "reactive", "components", "spa", "web-development", "desktop-apps", "electron",]
classifiers = [ "Intended Audience :: Developers", "Topic :: Software Development :: User Interfaces", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Internet :: WWW/HTTP :: Dynamic Content", "Topic :: Internet :: WWW/HTTP :: Site Management", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent", "Typing :: Typed", "Natural Language :: English",]
[[project.authors]]
name = "ztamdev"
email = "ztadevs@gmail.com"

[tool.pydepm.scripts]
dev = "cd LandingPage && dars dev"
build = "cd LandingPage && dars build"
test = "cd tst/proj/v1/v2 && python calculator_clean.py --port 3000"
prev = "cd docs && dars preview ./"

[[project.maintainers]]
name = "ztamdev"
email = "ztadevs@gmail.com"

[project.urls]
Homepage = "https://ztamdev.github.io/Dars-Framework/"
Documentation = "https://ztamdev.github.io/Dars-Framework/docs.html"
Repository = "https://github.com/ZtaMDev/Dars-Framework"
"Bug Tracker" = "https://github.com/ZtaMDev/Dars-Framework/issues"
Changelog = "https://github.com/ZtaMDev/Dars-Framework/releases"

[project.scripts]
dars = "dars.cli.main:main"

[tool.setuptools.packages.find]
include = [ "dars*",]
exclude = [ "LandingPage*",]

