[build-system]
requires = [ "setuptools>=42", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "dars-framework"
version = "1.9.18"
description = "Dars is a Full-Stack Python UI framework for building modern, interactive web applications entirely in Python. Seamlessly integrated with FastAPI, it lets you build complete applications with Server-Side Rendering (SSR), reactive SPA routing, static site generation, and a production-ready backend API — all from a single Python codebase."
dependencies = [ "rich==14.3.3", "bs4==0.0.2", "uvicorn==0.49.0", "markdown2==2.5.5", "requests==2.34.2", "plotly==6.8.0", "fastapi==0.136.3", "rjsmin==1.2.5", "rcssmin==1.2.2", "starlette==1.3.0", "python-multipart==0.0.32", "pydantic==2.13.4",]
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.11"
keywords = [ "ui-framework", "web-framework", "python-ui", "static-site-generator", "html-css-js", "reactive", "components", "spa", "web-development"]
classifiers = [ "Intended Audience :: Developers", "Topic :: Software Development :: User Interfaces", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Internet :: WWW/HTTP :: Dynamic Content", "Topic :: Internet :: WWW/HTTP :: Site Management", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent", "Typing :: Typed", "Natural Language :: English",]
[[project.authors]]
name = "ztamdev"
email = "ztadevs@gmail.com"

[tool.pydepm.scripts]
dev = "cd LandingPage && dars dev"
build = "cd LandingPage && dars build"
prev = "cd LandingPage && dars preview"

[[project.maintainers]]
name = "ztamdev"
email = "ztadevs@gmail.com"

[project.urls]
Homepage = "https://ztamdev.github.io/Dars-Framework/"
Documentation = "https://ztamdev.github.io/Dars-Framework/docs.html"
Repository = "https://github.com/ZtaMDev/Dars-Framework"
"Bug Tracker" = "https://github.com/ZtaMDev/Dars-Framework/issues"
Changelog = "https://github.com/ZtaMDev/Dars-Framework/releases"

[project.scripts]
dars = "dars.cli.main:main"

[tool.setuptools.packages.find]
include = [ "dars*",]
exclude = [ "LandingPage*",]

